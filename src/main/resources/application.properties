spring.application.name=formas-backend
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/formas-cms}
spring.datasource.driverClassName=${DATABASE_DRIVER:org.h2.Driver}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

formas.storage.root=${UPLOADS_DIR:./uploads}
formas.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,https://formas-react.vercel.app,https://formas-col.vercel.app}
formas.admin.email=${ADMIN_EMAIL:admin@formas.com}
formas.admin.password=${ADMIN_PASSWORD:Formas2026}
formas.jwt.secret=${JWT_SECRET:formas-local-dev-secret-change-me}
formas.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:43200}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:formas}

formas.payments.wompi.public-key=${WOMPI_PUBLIC_KEY:}
formas.payments.wompi.private-key=${WOMPI_PRIVATE_KEY:}
formas.payments.wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
formas.payments.wompi.events-secret=${WOMPI_EVENTS_SECRET:}
formas.payments.wompi.checkout-url=${WOMPI_CHECKOUT_URL:https://checkout.wompi.co/p/}
formas.payments.wompi.redirect-url=${WOMPI_REDIRECT_URL:https://formas-col.vercel.app/pago/resultado}

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=250MB
